<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>DocVault Document Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
    }

    body {
      color: #151823;
    }

    body.dark {
      color: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background: transparent;
    }

    #loading.hidden {
      display: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(128, 128, 128, 0.25);
      border-top-color: #666666;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #container {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      transform-origin: top left;
    }

    .docx-container {
      width: 100%;
      min-height: 100%;
      overflow: visible;
    }

    /* ============================================================
       PPTX SCROLLING
       ============================================================ */

    .pptx-scroll-area {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      padding: 0;
      margin: 0;
      background: transparent;
      display: block;
      box-sizing: border-box;
    }

    .pptx-zoom-content {
      position: relative;
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      transform-origin: top left;
      padding: 0;
      margin: 0;
    }

    .pptx-render-host {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
      display: block;
      box-sizing: border-box;
    }

    .pptx-render-host .pptx-preview-wrapper {
      width: 100% !important;
      max-width: none !important;
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      box-sizing: border-box !important;
    }

    /*
     * IMPORTANT:
     *
     * Do not force slide height here.
     * pptx-preview.js calculates the real
     * slide height from the PPTX dimensions.
     *
     * Only width is controlled by the
     * available viewer width.
     */
    .pptx-render-host .pptx-preview-slide-wrapper {
      position: relative !important;

      left: auto !important;
      top: auto !important;
      right: auto !important;
      bottom: auto !important;

      width: 100% !important;
      max-width: 100% !important;

      height: auto !important;

      margin: 0 0 2px 0 !important;

      flex: 0 0 auto !important;

      box-sizing: border-box !important;

      overflow: hidden !important;

      background: #FFFFFF !important;
    }

    .pptx-render-host
      .pptx-preview-slide-wrapper:last-child {
      margin-bottom: 0 !important;
    }

    /* ============================================================
       PPTX SLIDE NUMBER
       ============================================================ */

    .pptx-render-host .pptx-slide-number {
      position: absolute !important;
      left: 8px !important;
      top: 8px !important;

      z-index: 9999 !important;

      padding: 3px 7px !important;

      border-radius: 4px !important;

      background: rgba(0, 0, 0, 0.65) !important;

      color: #FFFFFF !important;

      font-size: 12px !important;
      line-height: 1.2 !important;

      font-family: Arial, sans-serif !important;

      font-weight: 600 !important;

      pointer-events: none !important;
      user-select: none !important;

      box-sizing: border-box !important;
    }

    /* ============================================================
       GENERIC IMAGE
       ============================================================ */

    .document-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* ============================================================
       ERROR
       ============================================================ */

    #error {
      display: none;
      width: 100%;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    #error.visible {
      display: flex;
    }

    .error-content {
      max-width: 500px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.75;
      white-space: pre-wrap;
    }

    body.dark #error {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loading-content">
      <div class="spinner"></div>
    </div>
  </div>

  <div id="error">
    <div class="error-content">
      <div class="error-title">
        Unable to open document
      </div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>
    </div>
  </div>

  <div id="container"></div>

  <script src="pptx-preview.js"></script>

  <script>
    /* ============================================================
       GLOBAL STATE
       ============================================================ */

    let currentDocType = '';

    let currentZoom = 1.0;

    let currentSlideMode = 'list';

    let pptxScrollArea = null;

    let pptxZoomContent = null;

    let pptxRenderHost = null;

    let receivedDocChunks = '';

    let receivedDocIsPpt = false;

    let lastPptxBase64 = '';

    /* ============================================================
       THEME
       ============================================================ */

    function setTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark');
      } else {
        document.body.classList.remove('dark');
      }
    }

    /* ============================================================
       LOADING
       ============================================================ */

    function showLoading() {
      const loading =
        document.getElementById('loading');

      if (loading) {
        loading.classList.remove('hidden');
      }

      const error =
        document.getElementById('error');

      if (error) {
        error.classList.remove('visible');
      }
    }

    function hideLoading() {
      const loading =
        document.getElementById('loading');

      if (loading) {
        loading.classList.add('hidden');
      }
    }

    function showError(message) {
      hideLoading();

      const error =
        document.getElementById('error');

      const errorMessage =
        document.getElementById(
          'errorMessage'
        );

      if (errorMessage) {
        errorMessage.textContent =
          message || 'Unknown error';
      }

      if (error) {
        error.classList.add('visible');
      }

      try {
        if (
          window.DocumentBridge &&
          typeof window.DocumentBridge.postMessage ===
            'function'
        ) {
          window.DocumentBridge.postMessage(
            'error:' +
            (message || 'Unknown error')
          );
        }
      } catch (_) {}
    }

    function notifySuccess() {
      try {
        if (
          window.DocumentBridge &&
          typeof window.DocumentBridge.postMessage ===
            'function'
        ) {
          window.DocumentBridge.postMessage(
            'success'
          );
        }
      } catch (_) {}
    }

    function notifyPageCount(count) {
      try {
        if (
          window.DocumentBridge &&
          typeof window.DocumentBridge.postMessage ===
            'function'
        ) {
          window.DocumentBridge.postMessage(
            'pagecount:' + count
          );
        }
      } catch (_) {}
    }

    function notifySlideChanged(
      current,
      total
    ) {
      try {
        if (
          window.DocumentBridge &&
          typeof window.DocumentBridge.postMessage ===
            'function'
        ) {
          window.DocumentBridge.postMessage(
            'slidechanged:' +
            current +
            ':' +
            total
          );
        }
      } catch (_) {}
    }

    /* ============================================================
       BASE64 HELPERS
       ============================================================ */

    function base64ToUint8Array(base64) {
      const binaryString =
        atob(base64);

      const len =
        binaryString.length;

      const bytes =
        new Uint8Array(len);

      for (
        let i = 0;
        i < len;
        i++
      ) {
        bytes[i] =
          binaryString.charCodeAt(i);
      }

      return bytes;
    }

    /* ============================================================
       PPTX DOM HELPERS
       ============================================================ */

    function getPptxLibraryWrapper() {
      if (!pptxRenderHost) {
        return null;
      }

      return pptxRenderHost.querySelector(
        ':scope > .pptx-preview-wrapper'
      );
    }

    function getRenderedPptxElements() {
      const wrapper =
        getPptxLibraryWrapper();

      if (!wrapper) {
        return [];
      }

      return Array.from(
        wrapper.querySelectorAll(
          ':scope > .pptx-preview-slide-wrapper'
        )
      );
    }

    function addPptxSlideNumbers() {
      const slides =
        getRenderedPptxElements();

      slides.forEach(
        (slide, index) => {
          let label =
            slide.querySelector(
              ':scope > .pptx-slide-number'
            );

          if (!label) {
            label =
              document.createElement(
                'div'
              );

            label.className =
              'pptx-slide-number';

            slide.appendChild(
              label
            );
          }

          label.textContent =
            'Slide ' +
            (index + 1);
        }
      );

      notifyPageCount(
        slides.length
      );
    }

    /* ============================================================
       STYLE PPTX DOM
       ============================================================ */

    function stylePptxDom(
      viewportWidth
    ) {
      if (
        !pptxRenderHost ||
        !pptxZoomContent ||
        !pptxScrollArea
      ) {
        return;
      }

      const viewportWidthSafe =
        Math.max(
          280,
          Math.min(
            viewportWidth,
            window.innerWidth - 10
          )
        );

      const wrapper =
        getPptxLibraryWrapper();

      if (!wrapper) {
        return;
      }

      pptxRenderHost.style.width =
        viewportWidthSafe + 'px';

      pptxRenderHost.style.maxWidth =
        viewportWidthSafe + 'px';

      pptxRenderHost.style.margin =
        '0 auto';

      pptxRenderHost.style.padding =
        '0';

      pptxRenderHost.style.display =
        'block';

      pptxRenderHost.style.height =
        'auto';

      /*
       * The scroll area is the
       * actual scrolling element.
       */
      pptxScrollArea.style.height =
        '100%';

      pptxScrollArea.style.minHeight =
        '0';

      /*
       * Let the PPTX wrapper grow
       * naturally for all slides.
       */
      wrapper.style.width =
        viewportWidthSafe + 'px';

      wrapper.style.maxWidth =
        viewportWidthSafe + 'px';

      wrapper.style.height =
        'auto';

      wrapper.style.minHeight =
        '0';

      wrapper.style.overflow =
        'visible';

      wrapper.style.margin =
        '0';

      wrapper.style.padding =
        '0';

      wrapper.style.position =
        'relative';

      /*
       * Put every slide into
       * normal vertical flow.
       */
      const slides =
        getRenderedPptxElements();

      slides.forEach(
        (slide) => {
          slide.style.position =
            'relative';

          slide.style.left =
            'auto';

          slide.style.top =
            'auto';

          slide.style.right =
            'auto';

          slide.style.bottom =
            'auto';

          /*
           * Width follows the
           * available viewer width.
           */
          slide.style.width =
            viewportWidthSafe + 'px';

          slide.style.maxWidth =
            viewportWidthSafe + 'px';

          /*
           * IMPORTANT:
           *
           * Do NOT set slide height.
           *
           * pptx-preview.js already
           * calculates the real height
           * from the PPTX dimensions.
           */
          slide.style.height =
            'auto';

          slide.style.margin =
            '0 0 2px 0';

          slide.style.flex =
            '0 0 auto';

          slide.style.overflow =
            'hidden';

          slide.style.boxSizing =
            'border-box';
        }
      );

      if (slides.length > 0) {
        slides[
          slides.length - 1
        ].style.marginBottom =
          '0';
      }

      addPptxSlideNumbers();

      requestAnimationFrame(
        () => {
          updatePptxScrollSize();

          setTimeout(
            () => {
              updatePptxScrollSize();
            },
            50
          );
        }
      );
    }

    /* ============================================================
       PPTX SCROLL SIZE
       ============================================================ */

    function updatePptxScrollSize() {
      if (
        !pptxZoomContent ||
        !pptxRenderHost ||
        !pptxScrollArea
      ) {
        return;
      }

      const wrapper =
        getPptxLibraryWrapper();

      if (!wrapper) {
        return;
      }

      /*
       * Get the REAL unscaled size
       * of the complete vertical
       * slide list.
       */
      const width =
        Math.max(
          wrapper.scrollWidth,
          wrapper.offsetWidth
        );

      const height =
        Math.max(
          wrapper.scrollHeight,
          wrapper.offsetHeight
        );

      /*
       * CSS transform does not affect
       * normal layout dimensions.
       *
       * Therefore the zoom content
       * receives the scaled dimensions
       * for correct scrolling.
       */
      pptxZoomContent.style.width =
        Math.max(
          width * currentZoom,
          pptxScrollArea.clientWidth
        ) + 'px';

      pptxZoomContent.style.height =
        Math.max(
          height * currentZoom,
          pptxScrollArea.clientHeight
        ) + 'px';

      /*
       * Apply zoom only to the
       * actual PPTX render.
       */
      pptxRenderHost.style.transform =
        'scale(' +
        currentZoom +
        ')';

      pptxRenderHost.style.transformOrigin =
        'top left';
    }

    /* ============================================================
       ZOOM
       ============================================================ */

    function setZoom(zoom) {
      currentZoom =
        Math.max(
          0.5,
          Math.min(
            3.0,
            Number(zoom) || 1.0
          )
        );

      if (
        currentDocType === 'pptx' &&
        pptxRenderHost &&
        pptxZoomContent
      ) {
        updatePptxScrollSize();
        return;
      }

      const container =
        document.getElementById(
          'container'
        );

      if (container) {
        container.style.transform =
          'scale(' +
          currentZoom +
          ')';

        container.style.transformOrigin =
          'top left';
      }
    }

    function zoomIn() {
      setZoom(
        currentZoom + 0.15
      );
    }

    function zoomOut() {
      setZoom(
        currentZoom - 0.15
      );
    }

    function resetZoom() {
      setZoom(1.0);
    }

    /* ============================================================
       DOCUMENT RENDERER
       ============================================================ */

    function renderDocument(
      type,
      base64Data
    ) {
      currentDocType =
        type;

      resetZoom();

      showLoading();

      try {
        if (type === 'pptx') {
          renderPptx(
            base64Data
          );
          return;
        }

        if (type === 'docx') {
          renderDocx(
            base64Data
          );
          return;
        }

        if (type === 'image') {
          renderImage(
            base64Data
          );
          return;
        }

        throw new Error(
          'Unsupported document type: ' +
          type
        );
      } catch (e) {
        showError(
          e && e.message
            ? e.message
            : String(e)
        );
      }
    }

    /* ============================================================
       DOCX
       ============================================================ */

    function renderDocx(
      base64Data
    ) {
      currentDocType =
        'docx';

      const container =
        document.getElementById(
          'container'
        );

      if (!container) {
        throw new Error(
          'Document container not found.'
        );
      }

      container.innerHTML =
        '';

      /*
       * Existing DOCX renderer.
       * pptx-preview is only used
       * for PPTX.
       */
      try {
        if (
          typeof window.docx !==
          'undefined'
        ) {
          /*
           * Keep compatibility with
           * existing DOCX implementation.
           */
        }
      } catch (_) {}

      /*
       * Existing DOCX rendering.
       */
      try {
        const bytes =
          base64ToUint8Array(
            base64Data
          );

        const blob =
          new Blob(
            [bytes],
            {
              type:
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const iframe =
          document.createElement(
            'iframe'
          );

        iframe.style.width =
          '100%';

        iframe.style.minHeight =
          '100vh';

        iframe.style.border =
          '0';

        iframe.src =
          url;

        container.appendChild(
          iframe
        );

        hideLoading();

        notifySuccess();
      } catch (e) {
        showError(
          'DOCX rendering failed: ' +
          e.message
        );
      }
    }

    /* ============================================================
       IMAGE
       ============================================================ */

    function renderImage(
      base64Data
    ) {
      currentDocType =
        'image';

      const container =
        document.getElementById(
          'container'
        );

      if (!container) {
        throw new Error(
          'Document container not found.'
        );
      }

      container.innerHTML =
        '';

      const image =
        document.createElement(
          'img'
        );

      image.className =
        'document-image';

      image.src =
        'data:image/png;base64,' +
        base64Data;

      image.onload =
        function () {
          hideLoading();
          notifySuccess();
        };

      image.onerror =
        function () {
          showError(
            'Image could not be loaded.'
          );
        };

      container.appendChild(
        image
      );
    }

    /* ============================================================
       PPTX
       ============================================================ */

    async function renderPptx(
      base64Data
    ) {
      currentDocType =
        'pptx';

      lastPptxBase64 =
        base64Data;

      const container =
        document.getElementById(
          'container'
        );

      if (!container) {
        throw new Error(
          'Document container not found.'
        );
      }

      container.innerHTML =
        '';

      if (
        typeof window.pptxPreview ===
        'undefined'
      ) {
        throw new Error(
          'pptx-preview.js is not loaded.'
        );
      }

      /*
       * Width follows the available
       * WebView width.
       *
       * We intentionally DO NOT calculate
       * a height or force 16:9 here.
       *
       * pptx-preview.js reads the actual
       * PPTX dimensions and calculates
       * the correct slide height itself.
       */
      const targetWidth =
        Math.max(
          280,
          window.innerWidth - 10
        );

      /*
       * Create dedicated PPTX
       * vertical scroll structure.
       */
      pptxScrollArea =
        document.createElement(
          'div'
        );

      pptxScrollArea.className =
        'pptx-scroll-area';

      pptxZoomContent =
        document.createElement(
          'div'
        );

      pptxZoomContent.className =
        'pptx-zoom-content';

      pptxRenderHost =
        document.createElement(
          'div'
        );

      pptxRenderHost.className =
        'pptx-render-host';

      pptxZoomContent.appendChild(
        pptxRenderHost
      );

      pptxScrollArea.appendChild(
        pptxZoomContent
      );

      container.appendChild(
        pptxScrollArea
      );

      /*
       * Initialize PPTX preview.
       *
       * IMPORTANT:
       *
       * Do not force targetHeight.
       * The library uses the real PPTX
       * presentation dimensions.
       */
      const preview =
        window.pptxPreview.init(
          pptxRenderHost,
          {
            width:
              targetWidth,
            mode:
              currentSlideMode
          }
        );

      /*
       * IMPORTANT:
       *
       * preview() is asynchronous.
       * Wait until ALL slides have
       * actually been rendered.
       */
      await preview.preview(
        base64Data
      );

      /*
       * Now the PPTX DOM actually
       * contains all slides.
       */
      stylePptxDom(
        targetWidth
      );

      /*
       * Give the browser one render
       * frame before measuring the
       * final scroll dimensions.
       */
      requestAnimationFrame(
        () => {
          updatePptxScrollSize();

          setTimeout(
            () => {
              addPptxSlideNumbers();

              updatePptxScrollSize();

              hideLoading();

              notifySuccess();
            },
            50
          );
        }
      );
    }

    /* ============================================================
       LARGE FILE CHUNKS
       ============================================================ */

    function receiveDocChunk(
      chunk,
      isFirst,
      isLast,
      isPpt
    ) {
      if (isFirst) {
        receivedDocChunks =
          '';

        receivedDocIsPpt =
          !!isPpt;
      }

      receivedDocChunks +=
        chunk;

      if (isLast) {
        const completeData =
          receivedDocChunks;

        const type =
          receivedDocIsPpt
            ? 'pptx'
            : 'docx';

        receivedDocChunks =
          '';

        receivedDocIsPpt =
          false;

        renderDocument(
          type,
          completeData
        );
      }
    }

    /* ============================================================
       SLIDE MODE
       ============================================================ */

    function setSlideMode(
      mode
    ) {
      /*
       * PPTX viewer is intentionally
       * kept in vertical list mode.
       */
      currentSlideMode =
        'list';

      if (
        currentDocType === 'pptx' &&
        lastPptxBase64
      ) {
        renderPptx(
          lastPptxBase64
        );
      }
    }

    /* ============================================================
       VIEW MODE
       ============================================================ */

    function setViewMode(
      mode
    ) {
      /*
       * Kept for compatibility with
       * pdf_viewer_screen.dart.
       */
    }

    /* ============================================================
       NEXT / PREVIOUS SLIDE
       ============================================================ */

    function getPptxSlides() {
      return getRenderedPptxElements();
    }

    function nextSlide() {
      const slides =
        getPptxSlides();

      if (slides.length === 0) {
        return;
      }

      const area =
        pptxScrollArea;

      if (!area) {
        return;
      }

      const current =
        area.scrollTop;

      let target =
        null;

      for (
        let i = 0;
        i < slides.length;
        i++
      ) {
        const top =
          slides[i].offsetTop;

        if (
          top >
          current + 10
        ) {
          target =
            slides[i];

          break;
        }
      }

      if (target) {
        area.scrollTo({
          top:
            target.offsetTop,

          behavior:
            'smooth'
        });
      }
    }

    function prevSlide() {
      const slides =
        getPptxSlides();

      if (slides.length === 0) {
        return;
      }

      const area =
        pptxScrollArea;

      if (!area) {
        return;
      }

      const current =
        area.scrollTop;

      let target =
        slides[0];

      for (
        let i =
          slides.length - 1;
        i >= 0;
        i--
      ) {
        const top =
          slides[i].offsetTop;

        if (
          top <
          current - 10
        ) {
          target =
            slides[i];

          break;
        }
      }

      area.scrollTo({
        top:
          target.offsetTop,

        behavior:
          'smooth'
      });
    }

    function goToSlide(
      index
    ) {
      const slides =
        getPptxSlides();

      if (
        index < 0 ||
        index >= slides.length
      ) {
        return;
      }

      const area =
        pptxScrollArea;

      if (!area) {
        return;
      }

      area.scrollTo({
        top:
          slides[index].offsetTop,

        behavior:
          'smooth'
      });

      notifySlideChanged(
        index + 1,
        slides.length
      );
    }

    /* ============================================================
       RESIZE
       ============================================================ */

    window.addEventListener(
      'resize',
      function () {
        if (
          currentDocType === 'pptx' &&
          pptxRenderHost
        ) {
          const width =
            Math.max(
              280,
              window.innerWidth - 10
            );

          stylePptxDom(
            width
          );

          updatePptxScrollSize();
        }
      }
    );

    /* ============================================================
       INITIAL MESSAGE HANDLER
       ============================================================ */

    window.addEventListener(
      'error',
      function (event) {
        if (
          event &&
          event.error
        ) {
          console.error(
            event.error
          );
        }
      }
    );

    /* ============================================================
       EXPOSE FUNCTIONS TO FLUTTER
       ============================================================ */

    window.setTheme =
      setTheme;

    window.renderDocument =
      renderDocument;

    window.renderDocx =
      renderDocx;

    window.renderPptx =
      renderPptx;

    window.renderImage =
      renderImage;

    window.receiveDocChunk =
      receiveDocChunk;

    window.setZoom =
      setZoom;

    window.zoomIn =
      zoomIn;

    window.zoomOut =
      zoomOut;

    window.resetZoom =
      resetZoom;

    window.setSlideMode =
      setSlideMode;

    window.setViewMode =
      setViewMode;

    window.nextSlide =
      nextSlide;

    window.prevSlide =
      prevSlide;

    window.goToSlide =
      goToSlide;
  </script>

</body>
</html>
