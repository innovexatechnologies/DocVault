<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>DocVault Document Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      overflow-x: hidden;
      overflow-y: auto;

      background: #F5F5F5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body.dark-mode {
      background: #0B1220;
      color: #FFFFFF;
    }

    #container {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow-x: hidden;
      overflow-y: visible;
    }

    /* =========================================================
       GENERAL DOCUMENT STYLES
       ========================================================= */

    .document-container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;

      padding: 10px;

      overflow-x: hidden;
      overflow-y: visible;
    }

    .page {
      width: 100%;
      max-width: 100%;

      margin: 0 auto 16px auto;

      background: #FFFFFF;

      overflow: hidden;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.10);

      border-radius: 8px;
    }

    body.dark-mode .page {
      background: #141D2E;
    }

    /* =========================================================
       DOCX
       ========================================================= */

    .docx-preview-container,
    .docx-wrapper {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto !important;

      overflow-x: hidden !important;
      overflow-y: visible !important;
    }

    .docx-wrapper {
      background: transparent !important;
    }

    .docx-page {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto 16px auto !important;

      overflow: hidden !important;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.10);

      background: #FFFFFF;
    }

    body.dark-mode .docx-page {
      background: #141D2E;
    }

    /* =========================================================
       PPTX
       ========================================================= */

    .pptx-preview-container,
    .pptx-wrapper {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto !important;

      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;

      background: transparent !important;

      overflow: visible !important;
      overflow-x: visible !important;
      overflow-y: visible !important;

      height: auto !important;

      touch-action: pan-y !important;
      overscroll-behavior-x: none !important;
    }

    .pptx-slide-card {
      width: 100% !important;
      max-width: 100% !important;

      margin: 10px auto 16px auto !important;

      flex: 0 0 auto !important;

      box-shadow:
        0 6px 24px rgba(0, 0, 0, 0.12);

      border-radius: 12px;

      overflow: hidden !important;

      background: #FFFFFF;

      position: relative;

      transform: none !important;

      touch-action: pan-y !important;
    }

    body.dark-mode .pptx-slide-card {
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.5);
    }

    /*
     * PPT list mode:
     * Every slide stays one below another.
     */
    .pptx-preview-container,
    .pptx-wrapper {
      flex-direction: column !important;
    }

    .pptx-slide-mode-wrap {
      display: flex;

      flex-direction: column;

      align-items: center;

      width: 100%;
    }

    .pptx-slide-badge {
      display: inline-block;

      margin-top: 10px;

      padding: 4px 12px;

      background: rgba(0, 0, 0, 0.6);

      color: #FFF;

      border-radius: 14px;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 0.3px;
    }

    /* Hide default PPTX internal buttons */

    .pptx-wrapper .pptx-next,
    .pptx-wrapper .pptx-pre,
    .pptx-wrapper .pptx-pagination {
      display: none !important;
    }

    /*
     * Keep PPT content inside available slide width.
     */

    .pptx-wrapper canvas,
    .pptx-wrapper img,
    .pptx-wrapper svg {
      max-width: 100% !important;
    }

    .pptx-wrapper canvas {
      display: block;
      height: auto;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */

    #toolbar {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 10px 12px;

      background: #FFFFFF;

      border-bottom: 1px solid #E5E7EB;

      position: sticky;

      top: 0;

      z-index: 100;
    }

    body.dark-mode #toolbar {
      background: #141D2E;

      border-bottom-color: #263247;
    }

    #toolbar button {
      border: none;

      background: transparent;

      padding: 8px;

      cursor: pointer;

      border-radius: 8px;
    }

    #toolbar button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    body.dark-mode #toolbar button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loading {
      width: 100%;

      min-height: 200px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 12px;

      color: #555;
    }

    body.dark-mode #loading {
      color: #CCC;
    }

    .spinner {
      width: 34px;

      height: 34px;

      border-radius: 50%;

      border: 4px solid #DDD;

      border-top-color: #555;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
       ========================================================= */

    #error {
      display: none;

      padding: 20px;

      text-align: center;

      color: #B00020;
    }

    body.dark-mode #error {
      color: #FF8A9B;
    }

    /* =========================================================
       IMAGE VIEWER
       ========================================================= */

    .image-preview {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 10px;

      overflow: hidden;
    }

    .image-preview img {
      max-width: 100%;

      height: auto;

      display: block;

      object-fit: contain;
    }

    /* =========================================================
       PDF
       ========================================================= */

    .pdf-preview-container {
      width: 100%;

      overflow-x: hidden;

      overflow-y: visible;
    }

    .pdf-page {
      width: 100%;

      margin: 0 auto 16px auto;

      background: #FFFFFF;

      overflow: hidden;
    }

    /* =========================================================
       ZOOM
       ========================================================= */

    .zoom-container {
      transform-origin: top center;

      transition:
        transform 0.15s ease;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {
      .document-container {
        padding: 10px;
      }

      .pptx-slide-card {
        border-radius: 8px;

        margin:
          8px auto 14px auto !important;
      }
    }
  </style>
</head>

<body>

  <div id="container">

    <div id="loading">
      <div class="spinner"></div>

      <div>
        Loading document...
      </div>
    </div>

    <div id="error"></div>

  </div>

  <script src="js/pptx-preview.js"></script>

  <script>
    /* =========================================================
       GLOBAL STATE
       ========================================================= */

    let currentDocType = null;

    let currentZoom = 1.0;

    let currentViewMode = 'page';

    /*
     * PPT MUST remain in list mode.
     *
     * list = all slides vertically
     * slide = one slide at a time
     */
    let currentSlideMode = 'list';

    let pptxPreviewInstance = null;

    let pptxData = null;

    let currentSlideIndex = 0;

    let totalSlidesCount = 0;

    let base64Chunks = [];

    let pptxBase64Data = null;


    /* =========================================================
       UTILITY FUNCTIONS
       ========================================================= */

    function getContainer() {
      return document.getElementById('container');
    }


    function showLoading() {
      const loading =
        document.getElementById('loading');

      if (loading) {
        loading.style.display = 'flex';
      }
    }


    function hideLoading() {
      const loading =
        document.getElementById('loading');

      if (loading) {
        loading.style.display = 'none';
      }
    }


    function showError(message) {
      hideLoading();

      const error =
        document.getElementById('error');

      if (!error) {
        return;
      }

      error.textContent =
        message || 'Unable to load document.';

      error.style.display =
        'block';
    }


    /* =========================================================
       BASE64
       ========================================================= */

    function base64ToArrayBuffer(base64) {
      const binaryString =
        atob(base64);

      const len =
        binaryString.length;

      const bytes =
        new Uint8Array(len);

      for (
        let i = 0;
        i < len;
        i++
      ) {
        bytes[i] =
          binaryString.charCodeAt(i);
      }

      return bytes.buffer;
    }


    /* =========================================================
       DOCUMENT CLEAR
       ========================================================= */

    function clearContainer() {
      const container =
        getContainer();

      if (!container) {
        return;
      }

      container.innerHTML = '';
    }


    /* =========================================================
       GENERIC DOCUMENT RENDER
       ========================================================= */

    function renderDocument(
      type,
      base64Data
    ) {
      currentDocType =
        type;

      showLoading();

      try {
        if (type === 'pptx') {
          renderPptx(base64Data);

          return;
        }

        if (type === 'docx') {
          renderDocx(base64Data);

          return;
        }

        if (type === 'image') {
          renderImage(base64Data);

          return;
        }

        showError(
          'Unsupported document type.'
        );
      } catch (error) {
        console.error(error);

        showError(
          error.message ||
          'Unable to render document.'
        );
      }
    }


    /* =========================================================
       IMAGE RENDER
       ========================================================= */

    function renderImage(base64Data) {
      clearContainer();

      const container =
        getContainer();

      const wrapper =
        document.createElement('div');

      wrapper.className =
        'image-preview';

      const image =
        document.createElement('img');

      image.src =
        'data:image/png;base64,' +
        base64Data;

      wrapper.appendChild(
        image
      );

      container.appendChild(
        wrapper
      );

      hideLoading();
    }


    /* =========================================================
       DOCX RENDER
       ========================================================= */

    async function renderDocx(base64Data) {
      clearContainer();

      const container =
        getContainer();

      const wrapper =
        document.createElement('div');

      wrapper.className =
        'docx-preview-container';

      container.appendChild(
        wrapper
      );

      try {
        if (
          typeof docxPreview ===
          'undefined'
        ) {
          throw new Error(
            'DOCX preview library not loaded.'
          );
        }

        const buffer =
          base64ToArrayBuffer(
            base64Data
          );

        await docxPreview.renderAsync(
          buffer,
          wrapper
        );

        hideLoading();
      } catch (error) {
        console.error(error);

        showError(
          'Unable to preview DOCX: ' +
          error.message
        );
      }
    }


    /* =========================================================
       PPTX RENDER
       ========================================================= */

    async function renderPptx(base64Data) {
      pptxBase64Data =
        base64Data;

      clearContainer();

      const container =
        getContainer();

      if (!container) {
        return;
      }

      /*
       * Width is based on the available
       * mobile/desktop viewport.
       */
      const screenWidth =
        window.innerWidth;

      const targetWidth =
        Math.max(
          280,
          screenWidth - 20
        );

      /*
       * PPT slides are 16:9.
       */
      const targetHeight =
        targetWidth * 9 / 16;

      try {
        if (
          typeof pptxPreview ===
          'undefined'
        ) {
          throw new Error(
            'PPTX preview library not loaded.'
          );
        }

        const buffer =
          base64ToArrayBuffer(
            base64Data
          );

        /*
         * IMPORTANT:
         * Always initialize PPTX in list mode.
         *
         * This allows the complete deck to be
         * rendered vertically.
         */
        pptxPreviewInstance =
          pptxPreview.init(
            container,
            {
              width:
                targetWidth,

              height:
                targetHeight,

              mode:
                currentSlideMode
            }
          );

        pptxData =
          await pptxPreviewInstance.preview(
            buffer
          );

        /*
         * Get slide count when available.
         */
        if (
          pptxData &&
          Array.isArray(
            pptxData.slides
          )
        ) {
          totalSlidesCount =
            pptxData.slides.length;
        } else {
          const slides =
            document.querySelectorAll(
              '.pptx-wrapper .slide, ' +
              '.pptx-wrapper .pptx-slide'
            );

          totalSlidesCount =
            slides.length;
        }

        /*
         * Apply vertical PPT layout
         * after renderer creates DOM.
         */
        stylePptxDom(
          targetWidth,
          targetHeight
        );

        /*
         * Renderer may create/update its DOM
         * asynchronously, so apply the layout
         * again on the next animation frame.
         */
        requestAnimationFrame(() => {
          stylePptxDom(
            targetWidth,
            targetHeight
          );
        });

        setupSwipeGestures();

        hideLoading();

      } catch (error) {
        console.error(
          'PPTX render error:',
          error
        );

        showError(
          'Unable to preview PPTX: ' +
          error.message
        );
      }
    }


    /* =========================================================
       PPTX DOM STYLING
       ========================================================= */

    function stylePptxDom(width, height) {
      const viewportWidth = Math.min(
        width,
        Math.max(
          280,
          window.innerWidth - 20
        )
      );

      const wrapper =
        document.querySelector(
          '.pptx-wrapper'
        );

      if (!wrapper) {
        return;
      }

      /*
       * The wrapper is the complete PPT deck.
       *
       * It must NOT become one large
       * scrollable slide.
       */
      wrapper.classList.remove(
        'pptx-slide-card'
      );

      wrapper.style.width =
        viewportWidth + 'px';

      wrapper.style.maxWidth =
        viewportWidth + 'px';

      wrapper.style.height =
        'auto';

      wrapper.style.minHeight =
        '0';

      wrapper.style.display =
        'flex';

      wrapper.style.flexDirection =
        'column';

      wrapper.style.alignItems =
        'center';

      wrapper.style.justifyContent =
        'flex-start';

      wrapper.style.gap =
        '0';

      wrapper.style.margin =
        '0 auto';

      /*
       * Scrolling belongs to the page,
       * not to the PPT wrapper.
       */
      wrapper.style.overflow =
        'visible';

      wrapper.style.overflowX =
        'visible';

      wrapper.style.overflowY =
        'visible';

      wrapper.style.position =
        'relative';

      /*
       * Find actual slide elements
       * generated by the PPT renderer.
       */
      let slides =
        Array.from(
          wrapper.querySelectorAll(
            '.pptx-slide, ' +
            '.slide, ' +
            '[data-slide-index], ' +
            '[data-slide]'
          )
        );

      /*
       * Fallback for renderers that use
       * direct children for slides.
       */
      if (slides.length === 0) {
        slides =
          Array.from(
            wrapper.children
          ).filter((child) => {
            const className =
              typeof child.className ===
              'string'
                ? child.className.toLowerCase()
                : '';

            return (
              !className.includes(
                'next'
              ) &&
              !className.includes(
                'prev'
              ) &&
              !className.includes(
                'pagination'
              ) &&
              !className.includes(
                'control'
              ) &&
              !className.includes(
                'button'
              )
            );
          });
      }

      /*
       * Every slide gets its own card
       * and stays vertically below the
       * previous slide.
       */
      slides.forEach((slide) => {
        slide.classList.add(
          'pptx-slide-card'
        );

        slide.style.display =
          'block';

        slide.style.flex =
          '0 0 auto';

        slide.style.width =
          viewportWidth + 'px';

        slide.style.maxWidth =
          viewportWidth + 'px';

        slide.style.minWidth =
          '0';

        /*
         * Keep the 16:9 slide ratio.
         */
        slide.style.height =
          height + 'px';

        slide.style.minHeight =
          height + 'px';

        slide.style.maxHeight =
          height + 'px';

        slide.style.margin =
          '10px 0 16px 0';

        slide.style.position =
          'relative';

        /*
         * A slide itself must not scroll.
         */
        slide.style.overflow =
          'hidden';

        slide.style.overflowX =
          'hidden';

        slide.style.overflowY =
          'hidden';

        slide.style.transform =
          'none';

        slide.style.boxSizing =
          'border-box';

        /*
         * Keep slide content completely
         * inside the slide.
         */
        const contents =
          slide.querySelectorAll(
            'canvas, svg, img'
          );

        contents.forEach(
          (element) => {
            element.style.maxWidth =
              '100%';

            element.style.maxHeight =
              '100%';

            element.style.boxSizing =
              'border-box';

            if (
              element.tagName
                .toLowerCase() ===
              'img'
            ) {
              element.style.width =
                '100%';

              element.style.height =
                '100%';

              element.style.objectFit =
                'contain';
            }
          }
        );
      });

      /*
       * Make direct canvases fit the
       * available slide width.
       */
      wrapper
        .querySelectorAll(
          'canvas'
        )
        .forEach(
          (canvas) => {
            canvas.style.maxWidth =
              '100%';

            canvas.style.height =
              'auto';

            canvas.style.display =
              'block';
          }
        );
    }


    /* =========================================================
       PPTX SWIPE GESTURES
       ========================================================= */

    function setupSwipeGestures() {
      /*
       * List mode is already vertically
       * scrollable, so there is no
       * horizontal swipe navigation.
       */
      if (
        currentSlideMode !==
        'slide'
      ) {
        return;
      }

      const wrapper =
        document.querySelector(
          '.pptx-wrapper'
        );

      if (!wrapper) {
        return;
      }

      let startX = 0;

      let startY = 0;

      wrapper.addEventListener(
        'touchstart',
        (event) => {
          if (
            !event.touches ||
            event.touches.length === 0
          ) {
            return;
          }

          startX =
            event.touches[0].clientX;

          startY =
            event.touches[0].clientY;
        },
        {
          passive: true
        }
      );

      wrapper.addEventListener(
        'touchend',
        (event) => {
          if (
            !event.changedTouches ||
            event.changedTouches.length === 0
          ) {
            return;
          }

          const endX =
            event.changedTouches[0]
              .clientX;

          const endY =
            event.changedTouches[0]
              .clientY;

          const diffX =
            endX - startX;

          const diffY =
            endY - startY;

          /*
           * Only horizontal gestures
           * navigate in single-slide mode.
           */
          if (
            Math.abs(diffX) >
              Math.abs(diffY) &&
            Math.abs(diffX) > 50
          ) {
            if (diffX < 0) {
              nextSlide();
            } else {
              prevSlide();
            }
          }
        },
        {
          passive: true
        }
      );
    }


    /* =========================================================
       NEXT SLIDE
       ========================================================= */

    function nextSlide() {
      if (
        currentSlideMode !==
        'slide'
      ) {
        return;
      }

      if (
        currentSlideIndex >=
        totalSlidesCount - 1
      ) {
        return;
      }

      currentSlideIndex++;

      if (
        pptxPreviewInstance &&
        typeof
          pptxPreviewInstance.renderSingleSlide ===
          'function'
      ) {
        pptxPreviewInstance
          .renderSingleSlide(
            currentSlideIndex
          );
      }
      else if (
        pptxPreviewInstance &&
        typeof
          pptxPreviewInstance.renderNextSlide ===
          'function'
      ) {
        pptxPreviewInstance
          .renderNextSlide();
      }
    }


    /* =========================================================
       PREVIOUS SLIDE
       ========================================================= */

    function prevSlide() {
      if (
        currentSlideMode !==
        'slide'
      ) {
        return;
      }

      if (
        currentSlideIndex <=
        0
      ) {
        return;
      }

      currentSlideIndex--;

      if (
        pptxPreviewInstance &&
        typeof
          pptxPreviewInstance.renderSingleSlide ===
          'function'
      ) {
        pptxPreviewInstance
          .renderSingleSlide(
            currentSlideIndex
          );
      }
      else if (
        pptxPreviewInstance &&
        typeof
          pptxPreviewInstance.renderPreSlide ===
          'function'
      ) {
        pptxPreviewInstance
          .renderPreSlide();
      }
    }


    /* =========================================================
       GO TO SLIDE
       ========================================================= */

    function goToSlide(index) {
      if (
        currentSlideMode !==
        'slide'
      ) {
        return;
      }

      if (
        index < 0 ||
        index >= totalSlidesCount
      ) {
        return;
      }

      currentSlideIndex =
        index;

      if (
        pptxPreviewInstance &&
        typeof
          pptxPreviewInstance.renderSingleSlide ===
          'function'
      ) {
        pptxPreviewInstance
          .renderSingleSlide(
            currentSlideIndex
          );
      }
    }


    /* =========================================================
       SET PPT SLIDE MODE
       ========================================================= */

    async function setSlideMode(mode) {
      /*
       * PPTX viewer is always a vertical list.
       *
       * Flutter may send "slide" mode, but this viewer
       * intentionally keeps all slides stacked vertically.
       */
      currentSlideMode = 'list';
      currentSlideIndex = 0;

      if (!pptxBase64Data) {
        return;
      }

      await renderPptx(
        pptxBase64Data
      );
    }


    /* =========================================================
       ZOOM
       ========================================================= */

    function setZoom(zoom) {
      currentZoom =
        Math.max(
          0.5,
          Math.min(
            3.0,
            zoom
          )
        );

      const content =
        document.querySelector(
          '.zoom-container'
        );

      if (content) {
        content.style.transform =
          'scale(' +
          currentZoom +
          ')';
      }
    }


    function zoomIn() {
      setZoom(
        currentZoom + 0.1
      );
    }


    function zoomOut() {
      setZoom(
        currentZoom - 0.1
      );
    }


    function resetZoom() {
      setZoom(1.0);
    }


    /* =========================================================
       RESIZE
       ========================================================= */

    let resizeTimer = null;

    window.addEventListener(
      'resize',
      () => {
        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          setTimeout(
            () => {
              if (
                currentDocType ===
                'pptx' &&
                pptxBase64Data
              ) {
                renderPptx(
                  pptxBase64Data
                );
              }
            },
            250
          );
      }
    );


    /* =========================================================
       DARK MODE
       ========================================================= */

    function setDarkMode(enabled) {
      if (enabled) {
        document.body.classList.add(
          'dark-mode'
        );
      } else {
        document.body.classList.remove(
          'dark-mode'
        );
      }
    }


    /* =========================================================
       MESSAGE HANDLING
       ========================================================= */

    window.addEventListener(
      'message',
      (event) => {
        if (
          !event.data
        ) {
          return;
        }

        const data =
          event.data;

        if (
          data.type ===
          'darkMode'
        ) {
          setDarkMode(
            data.enabled
          );

          return;
        }

        if (
          data.type ===
          'zoom'
        ) {
          setZoom(
            data.value
          );

          return;
        }

        if (
          data.type ===
          'pptxMode'
        ) {
          setSlideMode(
            data.mode
          );

          return;
        }

        if (
          data.type ===
          'render'
        ) {
          renderDocument(
            data.documentType,
            data.base64
          );
        }
      }
    );


    /* =========================================================
       FLUTTER WEBVIEW MESSAGE SUPPORT
       ========================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      () => {
        hideLoading();
      }
    );


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    window.DocVault =
      window.DocVault || {};

    window.DocVault.renderDocument =
      renderDocument;

    window.DocVault.renderPptx =
      renderPptx;

    window.DocVault.setSlideMode =
      setSlideMode;

    window.DocVault.setZoom =
      setZoom;

    window.DocVault.zoomIn =
      zoomIn;

    window.DocVault.zoomOut =
      zoomOut;

    window.DocVault.resetZoom =
      resetZoom;

    window.DocVault.setDarkMode =
      setDarkMode;

    window.DocVault.nextSlide =
      nextSlide;

    window.DocVault.prevSlide =
      prevSlide;

    window.DocVault.goToSlide =
      goToSlide;

  </script>

</body>
