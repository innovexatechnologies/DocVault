<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>DocVault Document Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      overflow-x: hidden;
      overflow-y: auto;

      background: #F5F5F5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body.dark-mode {
      background: #0B1220;
      color: #FFFFFF;
    }

    #container {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow-x: hidden;
      overflow-y: visible;
    }

    /* =========================================================
       GENERAL DOCUMENT STYLES
       ========================================================= */

    .document-container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;

      padding: 10px;

      overflow-x: hidden;
      overflow-y: visible;
    }

    .page {
      width: 100%;
      max-width: 100%;

      margin: 0 auto 16px auto;

      background: #FFFFFF;

      overflow: hidden;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.10);

      border-radius: 8px;
    }

    body.dark-mode .page {
      background: #141D2E;
    }

    /* =========================================================
       DOCX
       ========================================================= */

    .docx-preview-container,
    .docx-wrapper {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto !important;

      overflow-x: hidden !important;
      overflow-y: visible !important;
    }

    .docx-wrapper {
      background: transparent !important;
    }

    .docx-page {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto 16px auto !important;

      overflow: hidden !important;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.10);

      background: #FFFFFF;
    }

    body.dark-mode .docx-page {
      background: #141D2E;
    }

    /* =========================================================
       PPTX (FORCE CONTINUOUS VERTICAL SCROLL)
       ========================================================= */

    .pptx-preview-container,
    .pptx-wrapper,
    div[class*="pptx"] {
      width: 100% !important;
      max-width: 100% !important;

      margin: 0 auto !important;

      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;

      background: transparent !important;

      overflow: visible !important;
      height: auto !important;
    }

    /* Hide horizontal navigation controls */
    .pptx-wrapper .pptx-next,
    .pptx-wrapper .pptx-pre,
    .pptx-wrapper .pptx-pagination,
    .pptx-next,
    .pptx-pre,
    .pptx-pagination,
    .pptx-lines {
      display: none !important;
    }

    .pptx-slide-card,
    .pptx-wrapper > div,
    .slide,
    [data-slide] {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;

      margin: 0 auto 12px auto !important;

      flex: 0 0 auto !important;
      display: block !important;

      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
      border-radius: 8px !important;

      overflow: hidden !important;
      background: #FFFFFF !important;

      position: relative !important;
      transform: none !important;
      left: auto !important;
      top: auto !important;
    }

    body.dark-mode .pptx-slide-card,
    body.dark-mode .slide {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5) !important;
      background: #141D2E !important;
    }

    .pptx-wrapper canvas,
    .pptx-wrapper img,
    .pptx-wrapper svg,
    .slide canvas,
    .slide img {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      display: block !important;
      position: relative !important;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */

    #toolbar {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 10px 12px;

      background: #FFFFFF;

      border-bottom: 1px solid #E5E7EB;

      position: sticky;

      top: 0;

      z-index: 100;
    }

    body.dark-mode #toolbar {
      background: #141D2E;

      border-bottom-color: #263247;
    }

    #toolbar button {
      border: none;

      background: transparent;

      padding: 8px;

      cursor: pointer;

      border-radius: 8px;
    }

    #toolbar button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    body.dark-mode #toolbar button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loading {
      width: 100%;

      min-height: 200px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 12px;

      color: #555;
    }

    body.dark-mode #loading {
      color: #CCC;
    }

    .spinner {
      width: 34px;

      height: 34px;

      border-radius: 50%;

      border: 4px solid #DDD;

      border-top-color: #555;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
       ========================================================= */

    #error {
      display: none;

      padding: 20px;

      text-align: center;

      color: #B00020;
    }

    body.dark-mode #error {
      color: #FF8A9B;
    }

    /* =========================================================
       IMAGE VIEWER
       ========================================================= */

    .image-preview {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 10px;

      overflow: hidden;
    }

    .image-preview img {
      max-width: 100%;

      height: auto;

      display: block;

      object-fit: contain;
    }

    /* =========================================================
       PDF
       ========================================================= */

    .pdf-preview-container {
      width: 100%;

      overflow-x: hidden;

      overflow-y: visible;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;
    }

    .pdf-page-canvas {
      width: 100% !important;

      max-width: 100%;

      height: auto !important;

      background: #FFFFFF;

      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);

      border-radius: 6px;

      display: block;
    }

    /* =========================================================
       ZOOM
       ========================================================= */

    .zoom-container {
      width: 100%;

      transform-origin: top center;

      transition: transform 0.15s ease;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {
      .document-container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="container">

    <div id="loading">
      <div class="spinner"></div>
      <div>Loading document...</div>
    </div>

    <div id="error"></div>

    <div id="zoom-wrapper" class="zoom-container"></div>

  </div>

  <script src="js/pptx-preview.js"></script>
  <script src="js/pdf.min.js"></script>

  <script>
    /* =========================================================
       GLOBAL STATE
       ========================================================= */

    let currentDocType = null;
    let currentZoom = 1.0;
    let pptxPreviewInstance = null;
    let pptxData = null;
    let totalSlidesCount = 0;
    let pptxBase64Data = null;


    /* =========================================================
       UTILITY FUNCTIONS
       ========================================================= */

    function getContainer() {
      return document.getElementById('zoom-wrapper') || document.getElementById('container');
    }

    function showLoading() {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'flex';
    }

    function hideLoading() {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }

    function showError(message) {
      hideLoading();
      const error = document.getElementById('error');
      if (!error) return;
      error.textContent = message || 'Unable to load document.';
      error.style.display = 'block';
    }


    /* =========================================================
       BASE64
       ========================================================= */

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }


    /* =========================================================
       DOCUMENT CLEAR
       ========================================================= */

    function clearContainer() {
      const container = getContainer();
      if (!container) return;
      container.innerHTML = '';
    }


    /* =========================================================
       GENERIC DOCUMENT RENDER
       ========================================================= */

    function renderDocument(type, base64Data) {
      currentDocType = type;
      showLoading();

      try {
        if (type === 'pdf') {
          renderPdf(base64Data);
          return;
        }

        if (type === 'pptx') {
          renderPptx(base64Data);
          return;
        }

        if (type === 'docx') {
          renderDocx(base64Data);
          return;
        }

        if (type === 'image') {
          renderImage(base64Data);
          return;
        }

        showError('Unsupported document type.');
      } catch (error) {
        console.error(error);
        showError(error.message || 'Unable to render document.');
      }
    }


    /* =========================================================
       PDF RENDER
       ========================================================= */

    async function renderPdf(base64Data) {
      clearContainer();
      const container = getContainer();
      const pdfContainer = document.createElement('div');
      pdfContainer.className = 'pdf-preview-container';
      container.appendChild(pdfContainer);

      try {
        if (typeof pdfjsLib === 'undefined') {
          throw new Error('PDF.js library not loaded.');
        }

        const buffer = base64ToArrayBuffer(base64Data);
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pdfContainer.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }

        hideLoading();
      } catch (error) {
        console.error(error);
        showError('Unable to preview PDF: ' + error.message);
      }
    }


    /* =========================================================
       IMAGE RENDER
       ========================================================= */

    function renderImage(base64Data) {
      clearContainer();
      const container = getContainer();
      const wrapper = document.createElement('div');
      wrapper.className = 'image-preview';

      const image = document.createElement('img');
      image.src = 'data:image/png;base64,' + base64Data;

      wrapper.appendChild(image);
      container.appendChild(wrapper);
      hideLoading();
    }


    /* =========================================================
       DOCX RENDER
       ========================================================= */

    async function renderDocx(base64Data) {
      clearContainer();
      const container = getContainer();
      const wrapper = document.createElement('div');
      wrapper.className = 'docx-preview-container';
      container.appendChild(wrapper);

      try {
        if (typeof docxPreview === 'undefined') {
          throw new Error('DOCX preview library not loaded.');
        }

        const buffer = base64ToArrayBuffer(base64Data);
        await docxPreview.renderAsync(buffer, wrapper);
        hideLoading();
      } catch (error) {
        console.error(error);
        showError('Unable to preview DOCX: ' + error.message);
      }
    }


    /* =========================================================
       PPTX RENDER
       ========================================================= */

    async function renderPptx(base64Data) {
      if (typeof base64Data === 'string' && base64Data.includes(',')) {
        base64Data = base64Data.split(',')[1];
      }

      pptxBase64Data = base64Data;
      clearContainer();

      const container = getContainer();
      if (!container) return;

      const targetWidth = Math.max(280, window.innerWidth - 20);

      try {
        if (typeof pptxPreview === 'undefined') {
          throw new Error('PPTX preview library not loaded.');
        }

        const buffer = base64ToArrayBuffer(base64Data);

        // Force 'list' mode in init
        pptxPreviewInstance = pptxPreview.init(container, {
          width: targetWidth,
          mode: 'list'
        });

        pptxData = await pptxPreviewInstance.preview(buffer);

        // Continuous DOM enforcement
        enforceVerticalLayout();

        // Repeated checks in case library updates DOM asynchronously
        setTimeout(enforceVerticalLayout, 100);
        setTimeout(enforceVerticalLayout, 500);

        hideLoading();
      } catch (error) {
        console.error('PPTX render error:', error);
        showError('Unable to preview PPTX: ' + error.message);
      }
    }


    /* =========================================================
       FORCE VERTICAL LAYOUT (CAMSCANNER STYLE)
       ========================================================= */

    function enforceVerticalLayout() {
      const container = getContainer();
      if (!container) return;

      // Find all slide wrappers and slides
      const wrappers = container.querySelectorAll('.pptx-wrapper, div');
      wrappers.forEach(wrap => {
        wrap.style.setProperty('display', 'flex', 'important');
        wrap.style.setProperty('flex-direction', 'column', 'important');
        wrap.style.setProperty('align-items', 'center', 'important');
        wrap.style.setProperty('height', 'auto', 'important');
        wrap.style.setProperty('overflow', 'visible', 'important');
      });

      // Hide all pagination/next/prev buttons
      const navElements = container.querySelectorAll(
        '.pptx-next, .pptx-pre, .pptx-pagination, button'
      );
      navElements.forEach(el => {
        el.style.setProperty('display', 'none', 'important');
      });

      // Target slides directly
      const slides = container.querySelectorAll(
        '.slide, [data-slide], .pptx-slide-card, div[style*="position: absolute"]'
      );

      slides.forEach(slide => {
        slide.style.setProperty('position', 'relative', 'important');
        slide.style.setProperty('display', 'block', 'important');
        slide.style.setProperty('float', 'none', 'important');
        slide.style.setProperty('left', 'auto', 'important');
        slide.style.setProperty('top', 'auto', 'important');
        slide.style.setProperty('transform', 'none', 'important');
        slide.style.setProperty('margin', '0 auto 12px auto', 'important');
        slide.style.setProperty('width', '100%', 'important');
        slide.style.setProperty('height', 'auto', 'important');
      });
    }


    /* =========================================================
       ZOOM & DARK MODE & COMPATIBILITY STUBS
       ========================================================= */

    function setSlideMode(mode) {
      if (pptxBase64Data) renderPptx(pptxBase64Data);
    }

    function setZoom(zoom) {
      currentZoom = Math.max(0.5, Math.min(4.0, zoom));
      const content = document.getElementById('zoom-wrapper');
      if (content) {
        content.style.transform = 'scale(' + currentZoom + ')';
      }
    }

    function zoomIn() { setZoom(currentZoom + 0.15); }
    function zoomOut() { setZoom(currentZoom - 0.15); }
    function resetZoom() { setZoom(1.0); }

    function setDarkMode(enabled) {
      if (enabled) {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    function nextSlide() {}
    function prevSlide() {}
    function goToSlide(index) {}


    /* =========================================================
       MESSAGE HANDLING
       ========================================================= */

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const data = event.data;

      if (data.type === 'darkMode') setDarkMode(data.enabled);
      if (data.type === 'zoom') setZoom(data.value);
      if (data.type === 'pptxMode') setSlideMode(data.mode);
      if (data.type === 'render') renderDocument(data.documentType, data.base64);
    });

    document.addEventListener('DOMContentLoaded', () => {
      hideLoading();
    });

    /* Global API Exports */
    window.DocVault = window.DocVault || {};
    window.DocVault.renderDocument = renderDocument;
    window.DocVault.renderPptx = renderPptx;
    window.DocVault.renderPdf = renderPdf;
    window.DocVault.setSlideMode = setSlideMode;
    window.DocVault.setZoom = setZoom;
    window.DocVault.zoomIn = zoomIn;
    window.DocVault.zoomOut = zoomOut;
    window.DocVault.resetZoom = resetZoom;
    window.DocVault.setDarkMode = setDarkMode;
    window.DocVault.nextSlide = nextSlide;
    window.DocVault.prevSlide = prevSlide;
    window.DocVault.goToSlide = goToSlide;
  </script>

</body>
</html>
